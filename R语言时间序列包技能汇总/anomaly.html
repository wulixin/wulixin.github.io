<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>R异常检测包技能汇总 | R Anomaly Detection Package Skills</title>
<script src="https://d3js.org/d3.v7.min.js"></script>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0a0e1a;--bg2:#111827;--bg3:#1e293b;--text:#e2e8f0;--text2:#94a3b8;--border:#1e293b;--accent:#f43f5e;--glow:rgba(244,63,94,.3)}
html{scroll-behavior:smooth}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Noto Sans SC',sans-serif;background:var(--bg);color:var(--text);overflow-x:hidden;min-height:100vh}
#particles-canvas{position:fixed;top:0;left:0;width:100%;height:100%;z-index:0;pointer-events:none}
.container{position:relative;z-index:1;max-width:1400px;margin:0 auto;padding:0 20px}
header{position:sticky;top:0;z-index:100;background:rgba(10,14,26,.85);backdrop-filter:blur(20px);border-bottom:1px solid rgba(255,255,255,.06);padding:12px 0}
.header-inner{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px}
.logo-icon{font-size:28px}
.logo h1{font-size:20px;font-weight:700;background:linear-gradient(135deg,#f43f5e,#8b5cf6,#f59e0b);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.lang-btn{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);color:var(--text);padding:6px 16px;border-radius:20px;cursor:pointer;font-size:13px;font-weight:600;transition:all .3s;letter-spacing:1px}
.lang-btn:hover{background:rgba(244,63,94,.2);border-color:rgba(244,63,94,.4)}
.stats-bar{display:flex;gap:24px;padding:24px 0;flex-wrap:wrap;justify-content:center}
.stat-item{text-align:center}
.stat-num{font-size:28px;font-weight:800;background:linear-gradient(135deg,#f43f5e,#8b5cf6);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.stat-label{font-size:12px;color:var(--text2);margin-top:2px}
.search-box{max-width:500px;margin:16px auto;position:relative}
.search-box input{width:100%;padding:12px 20px 12px 44px;background:var(--bg2);border:1px solid var(--border);border-radius:12px;color:var(--text);font-size:14px;outline:none;transition:all .3s}
.search-box input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--glow)}
.search-box input::placeholder{color:var(--text2)}
.search-icon{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--text2);font-size:18px}
.tabs{display:flex;gap:4px;background:var(--bg2);border-radius:12px;padding:4px;margin:20px auto;max-width:460px}
.tab-btn{flex:1;padding:10px 16px;border:none;background:transparent;color:var(--text2);border-radius:10px;cursor:pointer;font-size:14px;font-weight:600;transition:all .3s}
.tab-btn.active{background:linear-gradient(135deg,#f43f5e,#8b5cf6);color:#fff;box-shadow:0 4px 15px rgba(244,63,94,.3)}
.tab-btn:hover:not(.active){color:var(--text);background:rgba(255,255,255,.05)}
.view-container{min-height:500px;padding:10px 0 60px}
.view{display:none}
.view.active{display:block}
#network-view{width:100%;height:700px;position:relative;border-radius:16px;overflow:hidden;background:rgba(17,24,39,.5);border:1px solid var(--border)}
#network-svg{width:100%;height:100%}
.tooltip{position:absolute;padding:10px 14px;background:rgba(15,23,42,.95);border:1px solid rgba(255,255,255,.1);border-radius:10px;font-size:13px;pointer-events:none;opacity:0;transition:opacity .2s;z-index:50;max-width:280px;backdrop-filter:blur(10px)}
.tooltip.show{opacity:1}
.tooltip-name{font-weight:700;margin-bottom:4px}
.tooltip-desc{color:var(--text2);font-size:12px}
.cards-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:16px;padding:10px 0}
.category-card{background:var(--bg2);border-radius:14px;padding:20px;border-left:4px solid var(--accent);cursor:pointer;transition:all .3s;border-top:1px solid transparent;border-right:1px solid transparent;border-bottom:1px solid transparent}
.category-card:hover{transform:translateY(-3px);box-shadow:0 8px 30px rgba(0,0,0,.3);border-top-color:rgba(255,255,255,.06);border-right-color:rgba(255,255,255,.06);border-bottom-color:rgba(255,255,255,.06)}
.card-header{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.card-icon{font-size:24px}
.card-title{font-size:16px;font-weight:700}
.card-desc{font-size:13px;color:var(--text2);margin-bottom:12px;line-height:1.5}
.card-tags{display:flex;flex-wrap:wrap;gap:6px}
.pkg-tag{padding:3px 10px;border-radius:12px;font-size:11px;background:rgba(255,255,255,.06);color:var(--text2);transition:all .2s}
.pkg-tag.core{background:rgba(244,63,94,.15);color:#fda4af;font-weight:600}
.pkg-tag.more{background:rgba(245,158,11,.15);color:#fcd34d}
.table-section{margin-bottom:24px}
.table-cat-header{display:flex;align-items:center;gap:8px;padding:12px 16px;background:var(--bg2);border-radius:10px;margin-bottom:8px;cursor:pointer;transition:all .2s;border-left:3px solid var(--accent)}
.table-cat-header:hover{background:var(--bg3)}
.table-cat-icon{font-size:18px}
.table-cat-name{font-weight:600;font-size:15px;flex:1}
.table-cat-count{font-size:12px;color:var(--text2);background:rgba(255,255,255,.06);padding:2px 10px;border-radius:10px}
.pkg-table{width:100%;border-collapse:separate;border-spacing:0 4px;margin-bottom:8px}
.pkg-table th{text-align:left;padding:8px 16px;font-size:12px;color:var(--text2);text-transform:uppercase;letter-spacing:.5px}
.pkg-table td{padding:8px 16px;font-size:13px;background:rgba(17,24,39,.4)}
.pkg-table tr td:first-child{border-radius:8px 0 0 8px}
.pkg-table tr td:last-child{border-radius:0 8px 8px 0}
.pkg-name{font-weight:600;color:#fda4af}
.core-star{color:#fbbf24}
.modal-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.7);z-index:200;display:none;align-items:center;justify-content:center;backdrop-filter:blur(4px)}
.modal-overlay.show{display:flex}
.modal{background:var(--bg2);border-radius:20px;max-width:800px;width:90%;max-height:85vh;overflow-y:auto;padding:32px;border:1px solid rgba(255,255,255,.08);position:relative;animation:modalIn .3s ease}
@keyframes modalIn{from{opacity:0;transform:scale(.95)}to{opacity:1;transform:scale(1)}}
.modal-close{position:absolute;top:16px;right:16px;background:none;border:none;color:var(--text2);font-size:24px;cursor:pointer;width:36px;height:36px;display:flex;align-items:center;justify-content:center;border-radius:50%;transition:all .2s}
.modal-close:hover{background:rgba(255,255,255,.1);color:var(--text)}
.modal-header{display:flex;align-items:center;gap:12px;margin-bottom:8px}
.modal-icon{font-size:32px}
.modal-title{font-size:22px;font-weight:700}
.modal-desc{color:var(--text2);margin-bottom:20px;line-height:1.6;font-size:14px}
.modal-pkgs{display:flex;flex-wrap:wrap;gap:8px}
.modal-pkg{padding:6px 14px;border-radius:10px;font-size:13px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.06);transition:all .2s}
.modal-pkg:hover{background:rgba(255,255,255,.1)}
.modal-pkg.core{background:rgba(244,63,94,.12);border-color:rgba(244,63,94,.25);color:#fda4af;font-weight:600}
.modal-pkg-name{font-weight:600}
.modal-pkg-desc{font-size:11px;color:var(--text2);margin-top:2px}
footer{text-align:center;padding:40px 0;color:var(--text2);font-size:13px;border-top:1px solid var(--border)}
footer a{color:#fb7185;text-decoration:none}
footer a:hover{text-decoration:underline}
.no-results{text-align:center;padding:60px 20px;color:var(--text2)}
.no-results-icon{font-size:48px;margin-bottom:12px}
::-webkit-scrollbar{width:8px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:var(--bg3);border-radius:4px}
::-webkit-scrollbar-thumb:hover{background:#334155}
@media(max-width:768px){
.header-inner{flex-direction:column;align-items:stretch;text-align:center}
.logo{justify-content:center}
.stats-bar{gap:16px}
.cards-grid{grid-template-columns:1fr}
#network-view{height:500px}
.modal{width:95%;padding:20px}
}
@media(max-width:480px){
.stat-num{font-size:22px}
.tabs{max-width:100%}
.tab-btn{padding:8px 10px;font-size:12px}
}
</style>
</head>

<div class="container">

<div class="header-inner">

</div>

</div>

// ========== STATE ==========
let lang = 'zh';
let searchQuery = '';
let currentTab = 'network';
let simulation = null;

// ========== LANGUAGE TOGGLE ==========
function toggleLang() {
  lang = lang === 'zh' ? 'en' : 'zh';
  const btn = document.getElementById('lang-toggle');
  btn.textContent = lang === 'zh' ? 'EN' : '中文';
  document.querySelectorAll('[data-zh]').forEach(el => {
    el.textContent = el.getAttribute('data-' + lang);
  });
  const input = document.getElementById('search-input');
  input.placeholder = input.getAttribute('data-placeholder-' + lang);
  document.documentElement.lang = lang === 'zh' ? 'zh-CN' : 'en';
  renderCurrentView();
}

// ========== SEARCH ==========
function handleSearch(val) {
  searchQuery = val.toLowerCase().trim();
  renderCurrentView();
}

function getFilteredCategories() {
  if (!searchQuery) return categories;
  return categories.map(cat => {
    const catMatch = cat[lang].toLowerCase().includes(searchQuery) || cat.id.toLowerCase().includes(searchQuery);
    const filteredPkgs = cat.packages.filter(p =>
      p.name.toLowerCase().includes(searchQuery) ||
      p[lang].toLowerCase().includes(searchQuery)
    );
    if (catMatch) return cat;
    if (filteredPkgs.length > 0) return {...cat, packages: filteredPkgs};
    return null;
  }).filter(Boolean);
}

// ========== TAB SWITCHING ==========
function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.tab-btn').forEach((btn, i) => {
    btn.classList.toggle('active', ['network','cards','table'][i] === tab);
  });
  document.querySelectorAll('.view').forEach((v, i) => {
    v.classList.toggle('active', ['network','cards','table'][i] === tab);
  });
  renderCurrentView();
}

function renderCurrentView() {
  if (currentTab === 'cards') renderCards();
  else if (currentTab === 'table') renderTable();
  else if (currentTab === 'network') renderNetwork();
}

// ========== NETWORK GRAPH ==========
function renderNetwork() {
  const container = document.getElementById('network-view');
  const svg = d3.select('#network-svg');
  svg.selectAll('*').remove();

  const width = container.clientWidth;
  const height = container.clientHeight;
  svg.attr('viewBox', `0 0 ${width} ${height}`);

  const filteredCats = getFilteredCategories();
  const catIds = new Set(filteredCats.map(c => c.id));

  const catNodes = filteredCats.map(c => ({
    id: c.id, type: 'category', name: c[lang], icon: c.icon, color: c.color,
    pkgCount: c.packages.length, radius: Math.max(28, Math.min(55, 20 + c.packages.length * 0.8))
  }));

  const pkgNodes = [];
  const links = [];
  filteredCats.forEach(c => {
    c.packages.forEach(p => {
      const nid = c.id + '::' + p.name;
      if (!pkgNodes.find(n => n.id === nid)) {
        pkgNodes.push({
          id: nid, type: 'package', name: p.name, desc: p[lang],
          core: p.core, catId: c.id, catName: c[lang], color: c.color,
          radius: p.core ? 7 : 5
        });
      }
      links.push({source: c.id, target: nid});
    });
  });

  const nodes = [...catNodes, ...pkgNodes];

  simulation = d3.forceSimulation(nodes)
    .force('link', d3.forceLink(links).id(d => d.id).distance(d => {
      const s = typeof d.source === 'object' ? d.source : nodes.find(n=>n.id===d.source);
      return s && s.type === 'category' ? 50 : 30;
    }).strength(0.6))
    .force('charge', d3.forceManyBody().strength(d => d.type === 'category' ? -200 : -15))
    .force('center', d3.forceCenter(width/2, height/2))
    .force('collision', d3.forceCollide().radius(d => d.radius + 2))
    .force('x', d3.forceX(width/2).strength(0.03))
    .force('y', d3.forceY(height/2).strength(0.03));

  const g = svg.append('g');

  const zoom = d3.zoom().scaleExtent([0.2, 5]).on('zoom', (event) => {
    g.attr('transform', event.transform);
  });
  svg.call(zoom);

  const linkSel = g.append('g').selectAll('line').data(links).enter().append('line')
    .attr('stroke', d => {
      const src = typeof d.source === 'object' ? d.source : nodes.find(n=>n.id===d.source);
      return src ? src.color : '#333';
    })
    .attr('stroke-opacity', 0.15)
    .attr('stroke-width', 0.8);

  const nodeSel = g.append('g').selectAll('g').data(nodes).enter().append('g')
    .call(d3.drag()
      .on('start', (event, d) => { if(!event.active) simulation.alphaTarget(0.3).restart(); d.fx=d.x; d.fy=d.y; })
      .on('drag', (event, d) => { d.fx=event.x; d.fy=event.y; })
      .on('end', (event, d) => { if(!event.active) simulation.alphaTarget(0); d.fx=null; d.fy=null; })
    );

  nodeSel.filter(d => d.type === 'category').each(function(d) {
    const g2 = d3.select(this);
    g2.append('circle').attr('r', d.radius)
      .attr('fill', d.color).attr('fill-opacity', 0.15)
      .attr('stroke', d.color).attr('stroke-width', 2).attr('stroke-opacity', 0.6);
    g2.append('text').attr('text-anchor','middle').attr('dy', d.radius > 35 ? '-0.3em' : '-0.5em')
      .attr('fill', d.color).attr('font-size', d.radius > 35 ? '16px' : '12px')
      .text(d.icon);
    g2.append('text').attr('text-anchor','middle').attr('dy', '1.2em')
      .attr('fill', '#e2e8f0').attr('font-size', d.radius > 35 ? '10px' : '8px')
      .attr('font-weight', '600')
      .text(d.name.length > 8 ? d.name.substring(0,7)+'…' : d.name);
    g2.append('text').attr('text-anchor','middle').attr('dy', '2.2em')
      .attr('fill', '#94a3b8').attr('font-size', '8px')
      .text(d.pkgCount + (lang==='zh'?'包':' pkgs'));
  });

  nodeSel.filter(d => d.type === 'package').each(function(d) {
    const g2 = d3.select(this);
    g2.append('circle').attr('r', d.radius)
      .attr('fill', d.core ? d.color : d.color)
      .attr('fill-opacity', d.core ? 0.7 : 0.3)
      .attr('stroke', d.core ? d.color : 'none')
      .attr('stroke-width', d.core ? 1.5 : 0);
  });

  const tooltip = document.getElementById('tooltip');

  nodeSel.on('mouseover', (event, d) => {
    tooltip.innerHTML = d.type === 'category'
      ? `<div class="tooltip-name" style="color:${d.color}">${d.icon} ${d.name}</div><div class="tooltip-desc">${d.pkgCount} ${lang==='zh'?'个R包':' R packages'}</div>`
      : `<div class="tooltip-name" style="color:${d.color}">${d.name}${d.core?' ★':''}</div><div class="tooltip-desc">${d.desc}</div>`;
    tooltip.classList.add('show');
    tooltip.style.left = (event.pageX - container.getBoundingClientRect().left + 15) + 'px';
    tooltip.style.top = (event.pageY - container.getBoundingClientRect().top - 10) + 'px';
  }).on('mouseout', () => {
    tooltip.classList.remove('show');
  });

  nodeSel.filter(d => d.type === 'category').on('click', (event, d) => {
    const cat = categories.find(c => c.id === d.id);
    if (cat) openModal(cat);
  });

  simulation.on('tick', () => {
    linkSel.attr('x1', d => d.source.x).attr('y1', d => d.source.y)
      .attr('x2', d => d.target.x).attr('y2', d => d.target.y);
    nodeSel.attr('transform', d => `translate(${d.x},${d.y})`);
  });
}

// ========== SKILL CARDS ==========
function renderCards() {
  const container = document.getElementById('cards-view');
  const filtered = getFilteredCategories();
  if (filtered.length === 0) {
    container.innerHTML = `<div class="no-results"><div class="no-results-icon">🔍</div><div>${lang==='zh'?'未找到匹配的R包':'No matching packages found'}</div></div>`;
    return;
  }
  container.innerHTML = `<div class="cards-grid">${filtered.map(cat => {
    const displayPkgs = cat.packages.slice(0, 12);
    const more = cat.packages.length - displayPkgs.length;
    return `<div class="category-card" style="border-left-color:${cat.color}" onclick='openModal(categories.find(c=>c.id===${JSON.stringify(cat.id)}))'>
      <div class="card-header">
        <span class="card-icon">${cat.icon}</span>
        <span class="card-title" style="color:${cat.color}">${cat[lang]}</span>
      </div>
      <div class="card-desc">${cat[lang+'Desc']}</div>
      <div class="card-tags">
        ${displayPkgs.map(p => `<span class="pkg-tag${p.core?' core':''}">${p.name}</span>`).join('')}
        ${more > 0 ? `<span class="pkg-tag more">+${more}</span>` : ''}
      </div>
    </div>`;
  }).join('')}</div>`;
}

// ========== MODAL ==========
function openModal(cat) {
  const overlay = document.getElementById('modal-overlay');
  const content = document.getElementById('modal-content');
  content.innerHTML = `
    <div class="modal-header">
      <span class="modal-icon">${cat.icon}</span>
      <div>
        <div class="modal-title" style="color:${cat.color}">${cat[lang]}</div>
        <div style="font-size:13px;color:var(--text2)">${cat[lang==='zh'?'en':'zh']}</div>
      </div>
    </div>
    <div class="modal-desc">${cat[lang+'Desc']}<br><span style="color:var(--text2)">${cat[(lang==='zh'?'en':'zh')+'Desc'] || ''}</span></div>
    <div style="font-size:13px;color:var(--text2);margin-bottom:12px">${cat.packages.length} ${lang==='zh'?'个R包':' R packages'}</div>
    <div class="modal-pkgs">
      ${cat.packages.map(p => `<div class="modal-pkg${p.core?' core':''}">
        <div class="modal-pkg-name">${p.name}${p.core?' ★':''}</div>
        <div class="modal-pkg-desc">${p[lang]}</div>
      </div>`).join('')}
    </div>
  `;
  overlay.classList.add('show');
  document.body.style.overflow = 'hidden';
}

function closeModal(event) {
  if (event && event.target !== document.getElementById('modal-overlay') && event.target !== document.querySelector('.modal-close')) return;
  document.getElementById('modal-overlay').classList.remove('show');
  document.body.style.overflow = '';
}

document.addEventListener('keydown', e => { if(e.key==='Escape') closeModal(); });

// ========== PARTICLES ==========
function initParticles() {
  const canvas = document.getElementById('particles-canvas');
  const ctx = canvas.getContext('2d');
  let particles = [];
  const count = 60;

  function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  resize();
  window.addEventListener('resize', resize);

  for (let i = 0; i < count; i++) {
    particles.push({
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height,
      vx: (Math.random() - 0.5) * 0.4,
      vy: (Math.random() - 0.5) * 0.4,
      r: Math.random() * 1.5 + 0.5
    });
  }

  function animate() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    particles.forEach(p => {
      p.x += p.vx;
      p.y += p.vy;
      if (p.x < 0 || p.x > canvas.width) p.vx *= -1;
      if (p.y < 0 || p.y > canvas.height) p.vy *= -1;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(244,63,94,0.25)';
      ctx.fill();
    });
    for (let i = 0; i < particles.length; i++) {
      for (let j = i + 1; j < particles.length; j++) {
        const dx = particles[i].x - particles[j].x;
        const dy = particles[i].y - particles[j].y;
        const dist = Math.sqrt(dx*dx + dy*dy);
        if (dist < 120) {
          ctx.beginPath();
          ctx.moveTo(particles[i].x, particles[i].y);
          ctx.lineTo(particles[j].x, particles[j].y);
          ctx.strokeStyle = `rgba(244,63,94,${0.08 * (1 - dist/120)})`;
          ctx.lineWidth = 0.5;
          ctx.stroke();
        }
      }
    }
    requestAnimationFrame(animate);
  }
  animate();
}

// ========== INIT ==========
window.addEventListener('DOMContentLoaded', () => {
  initParticles();
  renderNetwork();
});

window.addEventListener('resize', () => {
  if (currentTab === 'network') {
    clearTimeout(window._resizeTimer);
    window._resizeTimer = setTimeout(renderNetwork, 300);
  }
});
</script>
